name: Publicar Politicômetro Canoas (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "27 10 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar fonte e base eleitoral
        run: |
          node --check app.js
          python -m unittest discover -s tests -v
      - name: Atualizar fontes públicas oficiais
        run: python scripts/sync_sources.py
      - name: Validar fotografia atualizada
        run: python -m unittest discover -s tests -v
      - name: Montar site estático
        shell: bash
        run: |
          mkdir -p site/data
          cp index.html app.js styles.css favicon.svg .nojekyll site/
          cp data/politicos.json data/eleicoes.json data/canoas.geojson data/tse-2024.json site/data/
          test -s site/data/politicos.json
          test -s site/data/canoas.geojson
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Implantar site
        id: deployment
        uses: actions/deploy-pages@v4
