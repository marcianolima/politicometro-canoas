name: Publicar Politicômetro Canoas (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "27 10 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar fonte e base eleitoral
        run: |
          node --check app.js
          node --check extras.js
          node --check election-explorer.js
          python -m py_compile scripts/sync_sources.py scripts/collect_tre.py
          python -m unittest discover -s tests -v
      - name: Atualizar fontes públicas oficiais
        run: |
          python scripts/sync_sources.py
          python scripts/collect_tre.py
      - name: Validar fotografia atualizada
        run: python -m unittest discover -s tests -v
      - name: Montar site estático
        shell: bash
        run: |
          mkdir -p site/data
          cp index.html app.js extras.js election-explorer.js styles.css extras.css election-explorer.css favicon.svg .nojekyll site/
          cp data/politicos.json data/eleicoes.json data/composicao-camara.json data/senadores-rs.json data/prefeito-2024.json data/secoes-2024.json data/canoas.geojson data/tse-2024.json site/data/
          test -s site/data/politicos.json
          test -s site/data/canoas.geojson
          test -s site/data/prefeito-2024.json
          test -s site/data/secoes-2024.json
      - name: Instalar Chromium para smoke tests reais
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validar interface desktop/mobile em Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site >/tmp/politicometro-http.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          curl -fIsS http://127.0.0.1:8765/ >/dev/null
          node tests/smoke.mjs
      - name: Armazenar screenshots de homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-visual-chromium
          path: smoke-artifacts/
          if-no-files-found: ignore
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Implantar site
        id: deployment
        uses: actions/deploy-pages@v4
